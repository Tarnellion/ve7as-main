<!--
  Исходник public/og/default.png — общей карточки для страниц без своей
  обложки (инструменты, рубрики, статика). Статьям она не ставится: см.
  shareImage в src/layouts/BaseLayout.astro.

  Цвета повторяют токены темы (paper, ink, mark, rule) числами: в растре
  CSS-переменных нет. Другого текста здесь нет намеренно — один файл служит
  всем семи локалям. Шрифт системный, с внешних доменов ничего не грузится.

  Пересборка после правки (из корня репозитория):
  node -e "import('sharp').then(({default:s})=>s('scripts/og/default-card.svg').png().toFile('public/og/default.png'))"
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f4f5f2"/>
  <text x="600" y="346" text-anchor="middle" font-family="Georgia, serif" font-size="180" fill="#16211e">Ve<tspan fill="#0f5c4e">7</tspan>as</text>
  <line x1="360" y1="407" x2="840" y2="407" stroke="#d6dbd7" stroke-width="2"/>
</svg>
