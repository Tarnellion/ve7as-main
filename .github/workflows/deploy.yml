name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create .env
        run: |
          echo "SANITY_PROJECT_ID=${{ secrets.SANITY_PROJECT_ID }}" > .env
          echo "SANITY_DATASET=${{ secrets.SANITY_DATASET }}" >> .env
          printf "SANITY_API_TOKEN=%s" "${{ secrets.SANITY_API_TOKEN }}" >> .env

      - name: Build Astro
        run: npm run build

      - name: Patch wrangler config
        run: node scripts/patch-wrangler.mjs

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
