backend:
  name: github
  repo: Tarnellion/ve7as-main
  branch: main

site_url: https://ve7as.com
display_url: https://ve7as.com
logo_url: /favicon.svg

media_folder: "public/uploads"
public_folder: "/uploads"

slug:
  encoding: unicode
  clean_accents: true
  lowercase: true

collections:
  - name: sections
    label: "Разделы (ниши)"
    description: "Четыре основных направления сайта — отображаются в навигации и на главной странице"
    folder: "src/content/sections"
    create: false
    delete: false
    identifier_field: title
    fields:
      - { name: title, label: "Название раздела", widget: string }
      - { name: icon, label: "Иконка (эмодзи)", widget: string }
      - { name: description, label: "Описание раздела", widget: text }
      - { name: order, label: "Порядок в навигации", widget: number, value_type: int, default: 0 }

  - name: articles
    label: "Статьи и обзоры"
    description: "Редакционные материалы по нишам азартных развлечений"
    folder: "src/content/articles"
    create: true
    delete: true
    slug: "{{slug}}"
    sortable_fields: [pubDate, title, section]
    fields:
      - { name: title, label: "Заголовок", widget: string }
      - name: section
        label: "Раздел"
        widget: select
        options:
          - { label: "Казино и слоты", value: "casino-slots" }
          - { label: "Спортивные ставки", value: "sports-betting" }
          - { label: "Покер и настольные игры", value: "poker-table-games" }
          - { label: "Лотереи и киберспорт", value: "lottery-esports" }
      - { name: description, label: "Краткое описание (для карточек и SEO)", widget: text }
      - { name: pubDate, label: "Дата публикации", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: readingTime, label: "Время чтения (число минут)", widget: number, value_type: int, hint: "Например: 6 — единица измерения подставляется автоматически по языку" }
      - { name: author, label: "Автор", widget: string, default: "редакция" }
      - { name: featured, label: "Показывать на главной", widget: boolean, default: false }
      - { name: body, label: "Текст статьи", widget: markdown }

  - name: faq
    label: "Частые вопросы"
    description: "Вопросы и ответы для блока FAQ на главной и странице /faq"
    folder: "src/content/faq"
    create: true
    delete: true
    identifier_field: question
    fields:
      - { name: question, label: "Вопрос", widget: string }
      - { name: order, label: "Порядок отображения", widget: number, value_type: int, default: 0 }
      - { name: body, label: "Ответ", widget: markdown }

  - name: pages
    label: "Статичные страницы"
    description: "О проекте, контакты и юридические страницы"
    files:
      - name: about
        label: "О проекте"
        file: "src/content/pages/about.md"
        fields:
          - { name: title, label: "Заголовок", widget: string }
          - { name: description, label: "SEO-описание", widget: text }
          - { name: body, label: "Текст страницы", widget: markdown }
      - name: contacts
        label: "Контакты"
        file: "src/content/pages/contacts.md"
        fields:
          - { name: title, label: "Заголовок", widget: string }
          - { name: description, label: "SEO-описание", widget: text }
          - { name: body, label: "Текст страницы", widget: markdown }
      - name: privacy
        label: "Политика конфиденциальности"
        file: "src/content/pages/privacy.md"
        fields:
          - { name: title, label: "Заголовок", widget: string }
          - { name: description, label: "SEO-описание", widget: text }
          - { name: body, label: "Текст страницы", widget: markdown }
      - name: terms
        label: "Условия использования"
        file: "src/content/pages/terms.md"
        fields:
          - { name: title, label: "Заголовок", widget: string }
          - { name: description, label: "SEO-описание", widget: text }
          - { name: body, label: "Текст страницы", widget: markdown }
